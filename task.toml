schema_version = "2.0"
artifacts = ["/app"]
name = "backup-retention-reconciler"

[metadata]
author_name = "Jonathan"
author_email = "jtolbert0175@gmail.com"
difficulty_explanation = '''
Rebuilding this inventory and reconciler is the work of a storage-platform or backup infrastructure engineer picking up after a failed rollout. The prune cycle is the part that cannot be approximated, and the obvious reading of it is not merely
slower but wrong. Restores are chained: inside a vault the snapshots are one incremental chain and a
kept snapshot re-anchors it, so the candidates between two kept snapshots form a run that can only be
cut from its newest end. Dropping the largest candidates wherever they sit -- which is what the
superseded size-ordered rule did and what the shape of a per-repo cap invites -- deletes bases that
later snapshots still build on, and on this inventory it reports around ten per cent more reclaimed
bytes than is actually achievable while leaving chains broken. Respecting the chains but taking whole
runs in order of bytes per snapshot stays legal and still lands below the attainable optimum on every
repo. The cap has to be spent across roughly a thousand runs per repo at once.

The work is a dependent chain rather than a single repair. The rollout truncated the authoritative
inventory, so the first step is to merge a pre-incident catalogue with a replay journal under the
board's final recovery decision -- which record wins where they overlap, how a retraction is handled,
what ordering the replay follows -- and to trace past two superseded drafts that concatenate or
append instead. Every retention decision is computed over the wrong records until that is done.

Only then can the retention dialect itself be reconstructed from a long, mostly routine board log
rather than a specification: a governance calendar with its own day, week, month and year boundaries,
the earliest-of-bucket representative, per-tier caps, the pinned-hold exemption, cross-tier promotion,
a stateful per-repo quota ledger whose decay and size quantum both round up and which resets on an
idle boundary, and the protection-window overlap and depth figures. Several stages deliberately
deviate from a standard age-based scheme, so a stock scheduler keeps a different set. Every rule has
to be traced to its final dated decision, all arithmetic is integer with no date library, and a
correct run finishes in about eight seconds against the contract's 120-second budget. The data is
synthetic.
'''
solution_explanation = '''
solution/solve.sh drives the two dependent steps inside the environment container. Step one runs
solution/recover_inventory.py, which merges the pre-incident catalogue with the replay journal under
the board's final recovery decision -- replaying in ascending journal_seq, overwriting in place,
honouring retractions and stripping the journal's own bookkeeping -- and rewrites
/app/data/snapshots.json. Step two copies solution/reconcile_retention_fixed.py over
/app/workflow/reconcile_retention.py and runs it: canonicalization and de-duplication, the governance
calendar, the earliest-of-bucket representative under per-tier caps, the pinned-hold exemption,
cross-tier promotion, the stateful per-repo quota ledger with its ceiling decay and idle reset, and
the protection-window overlap and depth figures, each traced to its final dated ticket. The prune
cycle builds each repo's chain runs -- the candidates between two kept snapshots inside a vault --
and solves the selection exactly: a table over the runs against the remaining cap, maximising
reclaimed bytes with the snapshot count riding in the same integer as the second key, then walking
the runs in board order and taking the shallowest cut that still reaches the optimum. It writes
exactly summary.json, retention_state.json and retention_decisions.jsonl into --output-dir.
'''
verification_explanation = '''
The separate verifier (tests/Dockerfile builds an isolated image the agent cannot see) collects the
agent's whole /app as the declared artifact and runs tests/test_outputs.py against it. Step one is
graded directly: the recovered inventory must match a sealed digest, carry no journal bookkeeping and
leave both recovery sources byte-identical, and the shipped truncated file plus a naive concatenation
are each asserted different from it, with the agent's own reconciler re-run over the wrong
inventories and required to disagree with the sealed outputs. Step two executes the agent's
reconciler as a subprocess under an unprivileged uid (setpriv 65534, scrubbed environment, timeout at
the contract's own 120-second budget) over both the recovered inventory and a held-out alternate
stream, and diffs summary.json, retention_state.json and retention_decisions.jsonl against sealed
fixtures. The prune cycle is checked three ways beyond the digests: what is pruned inside every chain
run must be a suffix, so no pruned snapshot is left with a deferred one building on it; the bytes
reclaimed per repo must equal the optimum recomputed independently in the verifier by a different
formulation; and the two plausible wrong selections are shown to be wrong on this data, the
size-ordered one by reporting more bytes than is achievable and the chain-respecting greedy one by
reclaiming less. Schema, sort, tier, ledger, cap and summary-arithmetic invariants are asserted
separately, along with idempotency, the command-line defaults, an AST ban on date libraries and a
check that the committee dialect deviates from a stock scheme. The frozen snapshot
/app/workflow/.reconcile_retention.original is asserted present by hash and wrong by output.
Confirmed locally in the real two-container flow: after solve.sh the verifier gives reward 1; a fresh
environment gives 0; an environment where the reconciler is repaired but the inventory never
recovered gives 0; and a reconciler whose prune selection is a chain-respecting greedy rather than
the optimum also gives 0.
'''
relevant_experience = '''
Experience recovering a corrupted snapshot inventory from a catalogue plus a replay journal under
retraction/replacement semantics, and reconstructing stateful retention-scheduling pipelines from an
authoritative but noisy decision log rather than a clean spec -- tracing incrementally-revised rules
to their final form, matching a byte-level output contract, and deliberately avoiding a stock GFS
scheduler or date-library delegation where the governing calendar and retention dialect diverge from
standard semantics.
'''
category = "Software"
subcategory = "Systems"
tags = ["backup", "retention-policy", "incident-response", "data-recovery", "data-reconciliation"]
