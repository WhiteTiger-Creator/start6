artifacts = ["/app"]
name = "backup-retention-reconciler"

[metadata]
author_name = "Jonathan"
author_email = "jtolbert0175@gmail.com"
difficulty_explanation = '''
Restoring this reconciler is the work of a storage-platform or backup/DR engineer responding to a
botched rollout, and it is a genuinely dependent chain rather than a single repair. The rollout
truncated the authoritative snapshot inventory, so the first step is to rebuild
/app/data/snapshots.json by merging a pre-incident catalogue with a replay journal under the board's
final recovery decision -- in-place overwrite of a replayed snapshot_id, full retraction of a
retracted one, replay in ascending journal_seq order rather than file order, journal bookkeeping
fields stripped, and a specific resulting order. The catalogue is stale where the journal corrects
it, so a merge done any other way moves a snapshot into the wrong retention bucket and changes which
snapshots are kept, pruned and deferred; two superseded recovery entries (a February draft that says
to concatenate and let deduplication sort it out, a March interim that appends replayed snapshots at
the end and narrows retractions) are there to be traced past. Only then can the engineer reconstruct
the governance-defined tiered grandfather-father-son pipeline itself from a long, mostly-noise
decision log rather than a specification: the canonicalization and deduplication tie-break, the
governance calendar day/week/month/year boundaries, the earliest-of-bucket representative rule, the
per-tier caps, the pinned-hold exemption, the cross-tier promotion overlap, the stateful per-repo
quota ledger with idle-gap decay, reset boundary and cap, the prune ordering and the per-repo prune
cap all have to be traced to their FINAL dated decision, with each rounding direction fixed
independently. Many of those rules deliberately deviate from a standard age-based GFS "keep the last
N per period", so reaching for a calendar/date library or a stock GFS scheduler keeps a different set
and is rejected -- all time is integer epoch-seconds and the calendar math is done by hand. Holding
the recovery semantics and the whole interacting rule set in mind at once is what separates a correct
reconstruction from a plausible-looking one.
'''
solution_explanation = '''
solution/solve.sh drives the two dependent steps inside the environment container. Step one runs
solution/recover_inventory.py, which implements the board's final recovery decision (#RET-7170):
start from /app/data/snapshot_catalogue_pre_incident.json in file order, replay
/app/data/snapshot_replay_journal.json in ascending journal_seq order, overwrite the first record
already holding an appended snapshot_id in place, append genuinely new snapshots at the end, drop
every record named by a retraction, strip journal_seq / journal_op / reason, and write the rebuilt
array back over the truncated /app/data/snapshots.json. Step two copies
solution/reconcile_retention_fixed.py over /app/workflow/reconcile_retention.py and runs it against
that recovered inventory. The reconciler canonicalizes and deduplicates snapshots under the final
governance tie-break chain, assigns each snapshot to daily/weekly/monthly/yearly buckets with the
governance calendar (04:00 day roll, Sunday-start week, fixed 30-day month and 360-day year, all
integer epoch-second math), selects the earliest representative of each bucket up to the per-tier
caps, applies the pinned-hold exemption and the cross-tier promotion union, runs the stateful
per-repo quota ledger (ceil idle-gap decay, 30-day reset boundary, ceil size quantum, quota cap),
then prunes everything not kept and applies the per-repo prune cap after ordering, deferring the
overflow. It writes exactly summary.json, retention_state.json and compact retention_decisions.jsonl
into --output-dir. Every governing value is traced to its final entry in
/app/incident/retention_governance_log.md; report_spec.json supplies only the output contract and no
derivation rule.
'''
verification_explanation = '''
The separate verifier (tests/Dockerfile builds an isolated image the agent cannot see) collects the
agent's whole /app as the declared artifact and runs tests/test_outputs.py against it. Step one is
graded directly: the recovered /app/data/snapshots.json must equal the sealed expected inventory,
must carry only snapshot fields, and the shipped truncated file, the catalogue alone and the
superseded concatenation merge are each asserted different from it -- then the agent's own
reconciler is re-run on all three wrong inventories and required to disagree with the sealed
outputs, which is what makes the two steps provably dependent. Step two executes the agent's
/app/workflow/reconcile_retention.py as a subprocess under an unprivileged uid (setpriv 65534,
scrubbed environment, hard timeout) over both the recovered inventory and a held-out alternate
stream, and diffs summary.json, retention_state.json and retention_decisions.jsonl against sealed
fixtures generated from the reference. It also checks schema/field/sort/decision invariants, summary
math, idempotency, the CLI defaults, and that the policy and pin-registry source paths actually
influence output. A static AST scan forbids importing pandas/numpy and any date library, and a
dedicated test proves the governance dialect deviates from a standard age-based GFS: a naive
keep-latest-per-naive-period retention keeps a different set than the reconciler. The frozen broken
snapshot /app/workflow/.reconcile_retention.original is asserted present and wrong without pinning
its exact output. Confirmed locally in the real two-container flow: after solve.sh the verifier gives
reward 1; a fresh environment with no solve.sh gives 0, and so does an environment where the
reconciler is repaired but the inventory is never recovered.
'''
relevant_experience = '''
Experience recovering a corrupted snapshot inventory from a catalogue plus a replay journal under
retraction/replacement semantics, and reconstructing stateful retention-scheduling pipelines from an
authoritative but noisy decision log rather than a clean spec -- tracing incrementally-revised rules
to their final form, matching a byte-level output contract, and deliberately avoiding a stock GFS
scheduler or date-library delegation where the governing calendar and retention dialect diverge from
standard semantics.
'''
category = "Software"
subcategory = "Systems"
tags = ["backup", "retention-policy", "incident-response", "data-recovery", "data-reconciliation"]
expert_time_estimate_hours = 4
difficulty = "advanced"
languages = ["python"]

